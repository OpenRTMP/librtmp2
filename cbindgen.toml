language = "C"
include_guard = "LIBRTMP2_H"
pragma_once = true
include_version = true
documentation = true
usize_is_size_t = true
style = "both"
cpp_compat = true

header = """
/*
 * Automatically generated by cbindgen.
 * Do not edit this file manually.
 *
 * SPDX-License-Identifier: MIT
 */
"""

sys_includes = [
    "stdbool.h",
    "stddef.h",
    "stdint.h"
]

[parse]
parse_deps = false
clean = true

[export]
item_types = [
    "constants",
    "globals",
    "enums",
    "structs",
    "unions",
    "typedefs",
    "opaque",
    "functions"
]

[export.rename]
"Server" = "lrtmp2_server_t"
"ServerConfig" = "lrtmp2_server_config_t"
"Client" = "lrtmp2_client_t"
"Frame" = "lrtmp2_frame_t"
"Conn" = "lrtmp2_conn_t"

[fn]
rename_args = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "None"
