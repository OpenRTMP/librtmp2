[package]
name = "librtmp2"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
authors = ["OpenRTMP <info@openrtmp.org>", "AlexanderWagnerDev <info@alexanderwagnerdev.com>"]
description = "librtmp2 — RTMP/RTMPS protocol library"
license = "MIT"
repository = "https://github.com/OpenRTMP/librtmp2"

[workspace]
members = ["fuzz"]
resolver = "2"

[lib]
name = "librtmp2"
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = ["tls"]
tls = ["openssl"]

[dependencies]
libc = "0.2"
thiserror = "2"
openssl = { version = "0.10.70", optional = true }
parking_lot = "0.12"

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "relay"
harness = false
