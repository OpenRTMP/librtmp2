'''
          new = '''fn detect_audio_codec(payload: &[u8]) -> Option<String> {
    if let Some(cc) = first_track_fourcc(FrameType::Audio, payload) {
        return media_fourcc_auth_label(&cc);
    }
    // `exaudio_parse` intentionally disambiguates enhanced audio by checking
    // whether bytes 1..5 form a registered audio FourCC. That is correct for
    // ordinary media, but an unpeelable ModEx wrapper exposes extension bytes
    // there instead. Detect the wrapper marker first so a deep/malformed chain
    // cannot fall back to a legacy codec identity (notably AAC for 0x97).
    if payload
        .first()
        .is_some_and(|b| b & 0x80 != 0 && b & 0x0F == ERTMP_PACKET_TYPE_MODEX)
    {
        return None;
    }
    let mut hdr = AudioHeader::default();
'''
          if old not in text:
              raise SystemExit("detect_audio_codec target block not found")
          text = text.replace(old, new, 1)

          anchor = '''    #[test]
    fn on_media_cb_deny_list_blocks_wildcard_enhanced_fourcc() {
'''
          tests = '''    #[test]
    fn excessive_audio_modex_chain_cannot_bypass_codec_deny_list() {
        fn allow_aac_only(_: u64, frame_type: FrameType, codec: Option<&str>) -> bool {
            frame_type == FrameType::Audio && codec == Some("mp4a")
        }

        let mut conn = Conn::new();
        conn.relay_enabled = true;
        conn.negotiated_caps.has_caps_ex = true;
        conn.negotiated_caps.caps_ex_mask = CAPS_EX_MASK_MODEX;
        conn.current_stream = Some(Box::new(Stream::new(1)));
        conn.current_stream.as_mut().unwrap().is_publishing = true;
        conn.on_media_cb = Some(allow_aac_only);

        // The extension bytes are deliberately not a registered audio FourCC.
        // After the peel limit the raw 0x97 wrapper must remain an unknown
        // codec identity, not fall back through exaudio_parse to legacy AAC.
        let mut payload = vec![0x97];
        for _ in 0..40 {
            payload.extend_from_slice(&[0x00, 0x00, 0x07]);
        }
        payload.extend_from_slice(&[0x90, b'O', b'p', b'u', b's', 0xBB]);

        assert_eq!(
            conn.handle_media_frame(1, FrameType::Audio, 0, &payload),
            Err(ErrorCode::Auth),
            "unpeelable audio ModEx chains must not masquerade as legacy AAC"
        );
        assert!(conn.pending_relay.is_empty());
    }

    #[test]
    fn unnegotiated_legacy_g711u_is_not_force_normalized_as_modex() {
        fn allow_g711u(_: u64, frame_type: FrameType, codec: Option<&str>) -> bool {
            frame_type == FrameType::Audio && codec == Some("legacy:G711U")
        }

        let mut conn = Conn::new();
        conn.relay_enabled = true;
        // Legacy connect: capsEx/ModEx was never negotiated.
        conn.current_stream = Some(Box::new(Stream::new(1)));
        conn.current_stream.as_mut().unwrap().is_publishing = true;
        conn.on_media_cb = Some(allow_g711u);

        // 0x87 is a valid legacy G.711 mu-law header, but it also matches the
        // enhanced ModEx marker. These body bytes form a syntactically peelable
        // wrapper, so force-normalizing the downstream payload would turn it
        // into [0x80] and discard the three body bytes.
        let payload = vec![0x87, 0x00, 0x00, 0x00];
        assert_eq!(
            conn.handle_media_frame(1, FrameType::Audio, 0, &payload),
            Ok(())
        );
        assert_eq!(conn.detected_audio_codec.as_deref(), Some("legacy:G711U"));
        assert_eq!(conn.pending_relay.len(), 1);
        assert_eq!(conn.pending_relay[0].payload, payload);
        assert!(conn.pending_relay[0].cache_payload.is_none());
        assert_eq!(conn.pending_relay[0].cache_payload(), payload.as_slice());
    }

'''
