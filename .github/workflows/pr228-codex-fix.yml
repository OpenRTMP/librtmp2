      - name: Format
        run: cargo fmt --all

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-features --all-targets

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr228-codex-fix.yml
          git add src/session/conn.rs
          git diff --cached --check
          git commit -m "fix: address Codex ModEx review findings"
          git push origin "HEAD:cursor/application-security-review-6c9a"
