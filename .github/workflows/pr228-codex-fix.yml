name: Apply PR 228 Codex fixes

on:
  push:
    branches:
      - cursor/application-security-review-6c9a
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'push' || github.event.pull_request.number == 228
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/application-security-review-6c9a

      - name: Apply focused fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/session/conn.rs")
          text = path.read_text()

          old = '''        // Always peel ModEx wrappers for codec authorization and callbacks.
