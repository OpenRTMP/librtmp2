name: Interop (play / pull)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop-play:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Download mediamtx (real RTMP server)
      run: |
        ver=v1.21.3
        base="https://github.com/bluenviron/mediamtx/releases/download/${ver}"
        cd "$RUNNER_TEMP"
        curl -fsSLO --retry 5 --retry-delay 3 --retry-max-time 180 \
          --connect-timeout 15 --max-time 90 \
          --proto '=https' --proto-redir '=https' "$base/mediamtx_${ver}_linux_amd64.tar.gz"
        curl -fsSLO --retry 5 --retry-delay 3 --retry-max-time 180 \
          --connect-timeout 15 --max-time 90 \
          --proto '=https' --proto-redir '=https' "$base/checksums.sha256"
        grep "[ *]mediamtx_${ver}_linux_amd64.tar.gz\$" checksums.sha256 | sha256sum -c -
        tar xzf "mediamtx_${ver}_linux_amd64.tar.gz" mediamtx
        echo "MEDIAMTX=$RUNNER_TEMP/mediamtx" >> "$GITHUB_ENV"

    - name: Interop — play (pull) from real server
      run: ./tests/interop/play_interop.sh
