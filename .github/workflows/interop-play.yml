name: Interop (play / pull)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop-play:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Download mediamtx (real RTMP server)
      run: |
        ver=v1.9.3
        curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/${ver}/mediamtx_${ver}_linux_amd64.tar.gz" \
          | tar xz -C "$RUNNER_TEMP" mediamtx
        echo "MEDIAMTX=$RUNNER_TEMP/mediamtx" >> "$GITHUB_ENV"

    - name: Interop — play (pull) from real server
      run: ./tests/interop/play_interop.sh
