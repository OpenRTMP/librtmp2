    #[test]
    fn stale_owner_key_does_not_bypass_global_cache_cap() {
        let mut server = test_server();
        for i in 0..MAX_STREAM_CACHE_ENTRIES {
            server
                .stream_cache
                .insert(("filled".to_string(), i.to_string()), empty_stream_cache());
        }
        let stale_key = ("live".to_string(), "stale".to_string());
        server.publisher_cache_keys.insert(7, vec![stale_key.clone()]);

        server.cache_relay_frame(&relay_frame_for_publisher(
            7,
            "new-stream",
            FrameType::Video,
            vec![0x17, 0x00, 0xCC],
        ));

        let new_key = ("live".to_string(), "new-stream".to_string());
        assert_eq!(server.stream_cache.len(), MAX_STREAM_CACHE_ENTRIES);
        assert!(!server.stream_cache.contains_key(&new_key));
        assert!(
            !server
                .publisher_cache_keys
                .get(&7)
                .is_some_and(|keys| keys.contains(&stale_key))
        );
        assert!(
            !server
                .publisher_cache_keys
                .get(&7)
                .is_some_and(|keys| keys.contains(&new_key))
        );
    }

    #[test]
    fn shared_cache_key_is_preserved_when_owner_needs_space() {
        let mut server = test_server();
        let shared_key = ("live".to_string(), "shared".to_string());
        let mut shared_cache = empty_stream_cache();
        shared_cache.avc_header = Some(vec![0x17, 0x00, 0xAA]);
        server.stream_cache.insert(shared_key.clone(), shared_cache);
        server.publisher_cache_keys.insert(1, vec![shared_key.clone()]);
        server.publisher_cache_keys.insert(2, vec![shared_key.clone()]);
        server.resource_limits.max_stream_cache_bytes = 3;

        server.cache_relay_frame(&relay_frame_for_publisher(
            1,
            "new-stream",
            FrameType::Video,
            vec![0x17, 0x00, 0xBB],
        ));

        let new_key = ("live".to_string(), "new-stream".to_string());
        assert!(server.stream_cache.contains_key(&shared_key));
        assert!(!server.stream_cache.contains_key(&new_key));
        assert!(
            server
                .publisher_cache_keys
                .get(&2)
                .unwrap()
                .contains(&shared_key)
        );
    }

