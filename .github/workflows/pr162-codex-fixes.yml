            }
            let owned_by_other = self
                .publisher_cache_keys
                .iter()
                .any(|(owner_id, owner_keys)| {
                    *owner_id != publisher_conn_id && owner_keys.contains(&key)
                });
            if owned_by_other {
                continue;
            }
            self.evict_stream_cache_key(&key);
            return true;
        }
        false
    }

