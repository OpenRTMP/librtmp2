    fn evict_stream_cache_for_publisher(
        &mut self,
        publisher_conn_id: u64,
        except_key: &(String, String),
    ) -> bool {
        let Some(keys) = self.publisher_cache_keys.get(&publisher_conn_id).cloned() else {
            return false;
        };
        for key in keys {
            if &key == except_key {
                continue;
            }
            if !self.stream_cache.contains_key(&key) {
                if let Some(owner_keys) = self.publisher_cache_keys.get_mut(&publisher_conn_id) {
                    owner_keys.retain(|owned| owned != &key);
                }
