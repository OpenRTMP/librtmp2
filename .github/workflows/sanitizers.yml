name: Sanitizers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address-sanitizer:
    name: ASan (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run unit tests under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address -Cdebuginfo=1 -Copt-level=0"
          ASAN_OPTIONS: "detect_odr_violation=0"
        run: |
          cargo +nightly test --lib --all-features --verbose \
            -Zbuild-std --target x86_64-unknown-linux-gnu

  overflow-checks:
    name: Overflow checks (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run unit tests with integer overflow checks
        env:
          RUSTFLAGS: "-C overflow-checks=on"
        run: cargo test --locked --lib --all-features --verbose

  # No UBSan job: rustc's `-Zsanitizer` flag has no `undefined` value (its
  # accepted set is address/cfi/dataflow/hwaddress/kcfi/kernel-address/
  # kernel-hwaddress/leak/memory/memtag/safestack/shadow-call-stack/thread/
  # realtime) — rustc has no native UndefinedBehaviorSanitizer integration to
  # invoke here.

  thread-sanitizer:
    name: TSan (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The library keeps per-connection state deliberately unshared (see
      # CLAUDE.md "Threading"); TSan mainly guards against a future regression
      # that leaks mutable state across the `parking_lot` usage or FFI layer.
      - name: Run unit tests under ThreadSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=thread -Cdebuginfo=1 -Copt-level=0"
        run: |
          cargo +nightly test --lib --all-features --verbose \
            -Zbuild-std --target x86_64-unknown-linux-gnu

  examples-asan:
    name: ASan (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build examples under AddressSanitizer
        env:
          RUSTFLAGS: "-Zsanitizer=address -Cdebuginfo=1 -Copt-level=0"
          ASAN_OPTIONS: "detect_odr_violation=0"
        run: |
          cargo +nightly build --examples --all-features --verbose \
            -Zbuild-std --target x86_64-unknown-linux-gnu
