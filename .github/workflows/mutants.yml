name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  mutants:
    name: cargo-mutants (parser/codec modules)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@287108dbe62991710af5c9521514a6432c11be7c # cargo-mutants

      # Scoped to the parser/codec modules (highest payoff for catching
      # tests that run code without asserting on it) and time-boxed so the
      # weekly run stays cheap; widen the -f globs to cover more of src/
      # once this baseline is clean.
      #
      # No -j > 1: the integration tests this crate's test suite runs bind
      # fixed ports (e.g. 19661-19668), so concurrent mutant workers would
      # collide on the same port and get recorded as "caught" by an
      # unrelated bind failure rather than by the mutated logic actually
      # being exercised, inflating the mutation score.
      - name: Run cargo-mutants
        run: |
          timeout 55m cargo mutants --no-shuffle --all-features \
            -f 'src/amf/**' \
            -f 'src/chunk/**' \
            -f 'src/message/**' \
            -f 'src/flv/**' \
            -f 'src/ertmp/**' \
            -f 'src/handshake.rs' \
            -- -- --test-threads=2

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librtmp2-mutants-report
          path: mutants.out/**
