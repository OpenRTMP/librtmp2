name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0"

permissions:
  contents: read

jobs:
  mutants:
    name: cargo-mutants (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # The slowest shards in the previous run reached the old 65-minute job
    # limit while still processing valid mutants. Give them enough headroom
    # to finish and upload a complete report.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@5b1648e3a62caccd567cada14950a633a2bbe2eb # cargo-mutants

      # Scoped to the parser/codec modules (highest payoff for catching
      # tests that run code without asserting on it). The full set currently
      # contains enough mutants that a single serial runner exceeds the
      # workflow time budget, so split it across independent runners.
      # Round-robin sharding keeps the runtimes balanced while preserving
      # serial execution inside each runner.
      #
      # No -j > 1: the integration tests this crate's test suite runs bind
      # fixed ports (e.g. 19661-19668), so concurrent mutant workers on the
      # same runner would collide on the same port and get recorded as
      # "caught" by an unrelated bind failure rather than by the mutated
      # logic actually being exercised, inflating the mutation score.
      #
      # cargo-mutants uses exit code 2 for missed mutants and 3 for mutation
      # test timeouts. Those are useful findings from this reporting workflow,
      # not infrastructure failures, so preserve them as warnings and keep
      # uploading the complete report. Baseline/tool/configuration failures
      # still fail the job.
      - name: Run cargo-mutants
        id: mutants
        shell: bash
        run: |
          set +e
          cargo mutants --no-shuffle --all-features \
            --timeout 60 \
            --sharding round-robin \
            --shard "${{ matrix.shard }}/8" \
            -f 'src/amf/**' \
            -f 'src/chunk/**' \
            -f 'src/message/**' \
            -f 'src/flv/**' \
            -f 'src/ertmp/**' \
            -f 'src/handshake.rs' \
            -- -- --test-threads=2
          status=$?
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

          case "$status" in
            0)
              echo "::notice::All tested viable mutants in this shard were caught."
              ;;
            2)
              echo "::warning::cargo-mutants found missed mutants in this shard. See the uploaded report for details."
              ;;
            3)
              echo "::warning::cargo-mutants found timed-out mutants in this shard. See the uploaded report for details."
              ;;
            *)
              echo "::error::cargo-mutants failed with unexpected exit code $status."
              exit "$status"
              ;;
          esac

      - name: Summarize mutation results
        if: always()
        shell: bash
        run: |
          count_lines() {
            if [[ -f "$1" ]]; then
              wc -l < "$1" | tr -d ' '
            else
              printf '0'
            fi
          }

          caught="$(count_lines mutants.out/caught.txt)"
          missed="$(count_lines mutants.out/missed.txt)"
          timed_out="$(count_lines mutants.out/timeout.txt)"
          unviable="$(count_lines mutants.out/unviable.txt)"

          {
            echo "### cargo-mutants shard ${{ matrix.shard }}/8"
            echo
            echo "| Result | Count |"
            echo "| --- | ---: |"
            echo "| Caught | $caught |"
            echo "| Missed | $missed |"
            echo "| Timed out | $timed_out |"
            echo "| Unviable | $unviable |"
            echo
            echo "cargo-mutants exit code: \`${{ steps.mutants.outputs.exit_code || 'not available' }}\`"
            echo
            echo "Missed and timed-out mutants are reported as findings; unexpected cargo-mutants errors still fail the job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librtmp2-mutants-report-shard-${{ matrix.shard }}
          path: mutants.out/**
