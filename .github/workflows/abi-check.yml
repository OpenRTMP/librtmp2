name: ABI Compliance Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver-check:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@c95d1803f6ca46bd474491129f6b61cd55c98534 # cargo-semver-checks

      - name: Determine baseline ref
        id: baseline
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -vx "${GITHUB_REF#refs/tags/}" | head -1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found. Skipping semver comparison."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing against $PREV_TAG"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cargo-semver-checks
        if: steps.baseline.outputs.skip == 'false'
        run: cargo semver-checks --baseline-rev "${{ steps.baseline.outputs.tag }}"
