name: ABI Compliance Check

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver-check:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@7004425aaf76b4a9f193fb8ca53763b568ef461c # cargo-semver-checks

      - name: Determine baseline ref
        id: baseline
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -vx "${GITHUB_REF#refs/tags/}" | head -1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found. Skipping semver comparison."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing against $PREV_TAG"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cargo-semver-checks
        if: steps.baseline.outputs.skip == 'false'
        run: cargo semver-checks --baseline-rev "${{ steps.baseline.outputs.tag }}"

  c-abi-dump-check:
    name: C ABI dump (abi-compliance-checker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config abigail-tools abi-compliance-checker

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Determine baseline ref
        id: baseline
        run: |
          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -vx "${GITHUB_REF#refs/tags/}" | head -1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found. Skipping C ABI comparison."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing C ABI against $PREV_TAG"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity for stash/checkout
        if: steps.baseline.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run scripts/abi-baseline.sh compare
        if: steps.baseline.outputs.skip == 'false'
        run: bash scripts/abi-baseline.sh compare "${{ steps.baseline.outputs.tag }}"

      - name: Upload ABI report
        if: always() && steps.baseline.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librtmp2-abi-report
          path: abi-dumps/**
