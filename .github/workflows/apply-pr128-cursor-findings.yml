name: Apply PR 128 Cursor findings

on:
  push:
    branches:
      - feat/ertmp-v2-multitrack-0.4.0
    paths:
      - .github/workflows/apply-pr128-cursor-findings.yml
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/apply-pr128-cursor-findings.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply Cursor finding fixes
