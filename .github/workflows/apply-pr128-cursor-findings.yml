name: Apply PR 128 Cursor findings

on:
  push:
    branches:
      - feat/ertmp-v2-multitrack-0.4.0
    paths:
      - .github/workflows/apply-pr128-cursor-findings.yml
      - .github/apply-pr128-cursor-findings.py
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/apply-pr128-cursor-findings.yml
      - .github/apply-pr128-cursor-findings.py

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply Cursor finding fixes
        run: |
          python3 .github/apply-pr128-cursor-findings.py
          cargo fmt --all
          git diff --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Commit fixes
        run: |
          rm .github/workflows/apply-pr128-cursor-findings.yml
          rm .github/apply-pr128-cursor-findings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address Cursor findings on PR 128"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
