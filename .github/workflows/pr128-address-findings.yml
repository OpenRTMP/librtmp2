name: Apply PR 128 review fixes

on:
  push:
    branches:
      - feat/ertmp-v2-multitrack-0.4.0
    paths:
      - .github/workflows/pr128-address-findings.yml

permissions:
  contents: write

concurrency:
  group: pr128-address-findings
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/session/conn.rs",
              """        let cache_payload = if cache_payload == payload {
            None
        } else {
            Some(cache_payload.to_vec())
        };
""",
              """        let cache_payload = if cache_payload.len() == payload.len()
            && std::ptr::eq(cache_payload.as_ptr(), payload.as_ptr())
        {
            None
        } else {
            Some(cache_payload.to_vec())
        };
""",
          )

          replace_once(
              "src/session/conn.rs",
              """        if let Some(cb) = self.on_frame_cb {
            let mut track_ranges: Vec<(u8, usize, usize, [u8; 4], u8, u8)> = Vec::new();
            foreach_track(frame_type, parse_payload, |track| {
                let start = track.payload.as_ptr() as usize - parse_payload.as_ptr() as usize;
                track_ranges.push((
                    track.track_id,
                    start,
                    track.payload.len(),
                    track.fourcc,
                    track.packet_type,
                    track.video_frame_type,
                ));
            });
            if track_ranges.is_empty() {
                self.invoke_on_frame_cb(cb, frame_type, timestamp, u8::MAX, parse_payload);
            } else {
                for (track_id, start, len, fourcc, packet_type, video_frame_type) in track_ranges {
                    self.invoke_multitrack_on_frame_cb(
                        cb,
                        frame_type,
                        timestamp,
                        track_id,
                        fourcc,
                        packet_type,
                        video_frame_type,
                        &parse_payload[start..start + len],
                    );
                }
            }
        }
""",
              """        if let Some(cb) = self.on_frame_cb {
            let had_multitrack = foreach_track(frame_type, parse_payload, |track| {
                self.invoke_multitrack_on_frame_cb(
                    cb,
                    frame_type,
                    timestamp,
                    track.track_id,
                    track.fourcc,
                    track.packet_type,
                    track.video_frame_type,
                    track.payload,
                );
            });
            if !had_multitrack {
                self.invoke_on_frame_cb(cb, frame_type, timestamp, u8::MAX, parse_payload);
            }
        }
""",
          )

          replace_once(
              "src/client/mod.rs",
              """        let mut track_ranges: Vec<(u8, usize, usize, [u8; 4], u8, u8)> = Vec::new();
        foreach_track(frame_type, &payload, |track| {
            let start = track.payload.as_ptr() as usize - payload.as_ptr() as usize;
            track_ranges.push((
                track.track_id,
                start,
                track.payload.len(),
                track.fourcc,
                track.packet_type,
                track.video_frame_type,
            ));
        });
        if track_ranges.is_empty() {
            self.invoke_on_frame_cb(cb, frame_type, timestamp, u8::MAX, &payload);
        } else {
            for (track_id, start, len, fourcc, packet_type, video_frame_type) in track_ranges {
                self.invoke_multitrack_on_frame_cb(
                    cb,
                    frame_type,
                    timestamp,
                    track_id,
                    fourcc,
                    packet_type,
                    video_frame_type,
                    &payload[start..start + len],
                );
            }
        }
""",
              """        let had_multitrack = foreach_track(frame_type, &payload, |track| {
            self.invoke_multitrack_on_frame_cb(
                cb,
                frame_type,
                timestamp,
                track.track_id,
                track.fourcc,
                track.packet_type,
                track.video_frame_type,
                track.payload,
            );
        });
        if !had_multitrack {
            self.invoke_on_frame_cb(cb, frame_type, timestamp, u8::MAX, &payload);
        }
""",
          )
          PY

      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          rustup default stable
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr128-address-findings.yml
          git add src/session/conn.rs src/client/mod.rs
          git commit -m "fix: harden multitrack callback handling"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
