name: Apply PR 128 review fixes

on:
  push:
    branches:
      - feat/ertmp-v2-multitrack-0.4.0
    paths:
      - .github/workflows/pr128-address-findings.yml
      - .github/scripts/pr128_address_findings.py

permissions:
  contents: write

concurrency:
  group: pr128-address-findings
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0

      - name: Apply and commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/pr128_address_findings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr128-address-findings.yml
          git rm .github/scripts/pr128_address_findings.py
          git add src/session/conn.rs src/client/mod.rs
          git commit -m "fix: harden multitrack callback handling"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
