name: Apply PR 128 fixes

on:
  push:
    branches:
      - feat/ertmp-v2-multitrack-0.4.0
    paths:
      - scripts/apply_pr128_fixes.py
      - scripts/apply_pr128_followup.py
      - scripts/apply_pr128_followup2.py
      - .github/workflows/apply-pr128-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Apply and validate fixes
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          {
            echo '== apply patch =='
            python3 scripts/apply_pr128_followup2.py
            status=$?
            if [ "$status" -eq 0 ]; then
              echo '== cargo fmt =='
              cargo fmt --all
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              echo '== cargo test --all-targets =='
              cargo test --all-targets
              status=$?
            fi
            if [ "$status" -eq 0 ]; then
              echo '== cargo clippy --all-targets -- -D warnings =='
              cargo clippy --all-targets -- -D warnings
              status=$?
            fi
            echo "== exit status: $status =="
          } > /tmp/pr128-fix-results.log 2>&1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validated fixes
        if: steps.validate.outputs.status == '0'
        run: |
          rm scripts/apply_pr128_fixes.py
          rm scripts/apply_pr128_followup.py
          rm scripts/apply_pr128_followup2.py
          rm .github/workflows/apply-pr128-fixes.yml
          rm -f pr128-fix-results.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address E-RTMP v2 review findings"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0

      - name: Commit failure diagnostics
        if: steps.validate.outputs.status != '0'
        run: |
          git reset --hard HEAD
          cp /tmp/pr128-fix-results.log pr128-fix-results.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr128-fix-results.log
          git commit -m "ci: capture PR 128 fix failure"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
