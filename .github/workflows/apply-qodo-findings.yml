name: Apply PR 128 review fixes (one-shot)

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/apply-qodo-findings.yml
      - .github/scripts/apply_pr128_fixes.py

permissions:
  contents: write

concurrency:
  group: apply-qodo-findings-pr128
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Apply fixes
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          import textwrap
          import traceback

          def preserve_rust_indent(value: str) -> str:
              lines = value.splitlines()
              if lines and not lines[0].strip():
                  lines.pop(0)
              if lines and not lines[-1].strip():
                  lines.pop()
              return "\n".join(lines)

          textwrap.dedent = preserve_rust_indent
          Path(".github/pr128-fix-error.txt").unlink(missing_ok=True)
          Path(".github/pr128-validation-error.txt").unlink(missing_ok=True)
          try:
              runpy.run_path(".github/scripts/apply_pr128_fixes.py", run_name="__main__")
          except BaseException:
              Path(".github/pr128-fix-error.txt").write_text(traceback.format_exc())
              raise
          PY
      - name: Commit patch diagnostics
        if: steps.apply.outcome == 'failure'
        run: |
          cp .github/pr128-fix-error.txt /tmp/pr128-fix-error.txt
          git reset --hard HEAD
          rm -f .github/pr128-validation-error.txt
          mkdir -p .github
          cp /tmp/pr128-fix-error.txt .github/pr128-fix-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr128-fix-error.txt .github/pr128-validation-error.txt
          git commit -m "ci: record PR 128 patch failure"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
          exit 1
      - name: Format and validate
        id: validate
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo test --all-targets
            cargo clippy --all-targets -- -D warnings
          } 2>&1 | tee /tmp/pr128-validation-error.txt
      - name: Commit validation diagnostics
        if: steps.apply.outcome == 'success' && steps.validate.outcome == 'failure'
        run: |
          cp /tmp/pr128-validation-error.txt /tmp/pr128-validation-error.saved
          git reset --hard HEAD
          rm -f .github/pr128-fix-error.txt
          mkdir -p .github
          cp /tmp/pr128-validation-error.saved .github/pr128-validation-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/pr128-fix-error.txt .github/pr128-validation-error.txt
          git commit -m "ci: record PR 128 validation failure"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
          exit 1
      - name: Commit fixes
        if: steps.apply.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address latest PR review findings"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
