name: Apply PR 128 review fixes (one-shot)

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/apply-qodo-findings.yml
      - .github/scripts/apply_pr128_fixes.py

permissions:
  contents: write

concurrency:
  group: apply-qodo-findings-pr128
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Apply fixes
        run: python .github/scripts/apply_pr128_fixes.py
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address latest PR review findings"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
