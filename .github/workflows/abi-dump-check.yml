name: C ABI Dump Check

# scripts/abi-baseline.sh compare does `cargo clean --release` and a full
# `cargo build --release --all-features` TWICE (once per commit it diffs),
# which took 40+ minutes in practice - far too slow for every push/PR, and
# CLAUDE.md already documents this as a pre-release check, not a per-commit
# one. Run it off the hot path instead: weekly, on push to main, and on
# demand.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  c-abi-dump-check:
    name: C ABI dump (abi-compliance-checker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config abigail-tools abi-compliance-checker

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Determine baseline ref
        id: baseline
        run: |
          HEAD_COMMIT=$(git rev-parse HEAD)
          PREV_TAG=$(
            git tag --list 'v*' --sort=-version:refname |
              while IFS= read -r tag; do
                [ "$(git rev-list -n1 "$tag")" = "$HEAD_COMMIT" ] || {
                  printf '%s\n' "$tag"
                  break
                }
              done
          )
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found. Skipping C ABI comparison."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing C ABI against $PREV_TAG"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity for stash/checkout
        if: steps.baseline.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run scripts/abi-baseline.sh compare
        if: steps.baseline.outputs.skip == 'false'
        run: bash scripts/abi-baseline.sh compare "${{ steps.baseline.outputs.tag }}"

      - name: Upload ABI report
        if: always() && steps.baseline.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librtmp2-abi-report
          path: abi-dumps/**
