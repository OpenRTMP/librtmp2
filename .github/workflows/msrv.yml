name: MSRV

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    name: cargo build/test (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "Could not read rust-version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build (default features) at MSRV
        run: cargo build --locked --all-features --verbose

      - name: Test (default features) at MSRV
        run: cargo test --locked --all-features --verbose

      - name: Build & test without TLS at MSRV
        run: |
          cargo build --locked --no-default-features --verbose
          cargo test --locked --no-default-features --verbose
