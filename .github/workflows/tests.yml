name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: cursor/application-security-review-6876
        fetch-depth: 0

    - name: Apply PR 132 review fix
      run: python3 .github/scripts/pr132_review_fix.py

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Format
      run: cargo fmt --all -- --check

    - name: Build (default features)
      run: cargo build --all-features --verbose

    - name: Run tests (default features)
      run: cargo test --all-features --verbose

    - name: Run E2E integration tests (serial)
      run: |
        cargo test --all-features --verbose \
          --test server_client_loopback \
          --test e2e_publish_play_same_listener \
          --test e2e_publish_rejection \
          --test e2e_multiple_frames \
          --test e2e_audio_frames \
          -- --test-threads=1

    - name: Build & test without TLS
      run: |
        cargo build --no-default-features --verbose
        cargo test --no-default-features --verbose

    - name: Clippy
      run: cargo clippy --all-features --all-targets

    - name: Commit validated fix
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout 99a23475c4d58bd3c64dd86fcbd3bb121b5226be -- .github/workflows/tests.yml
        git rm .github/workflows/apply-pr132-review-fix.yml
        git rm .github/pr132-review-fix.trigger
        git rm .github/scripts/pr132_review_fix.py
        git add src/session/conn.rs src/client/mod.rs .github/workflows/tests.yml
        git commit -m "Fix rejection of invalid multitrack containers"
        git push origin HEAD:cursor/application-security-review-6876
