name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
        sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Build (default features)
      run: cargo build --all-features --verbose

    - name: Run tests (default features)
      run: cargo test --all-features --verbose

    - name: Run E2E integration tests (serial)
      run: |
        cargo test --all-features --verbose \
          --test server_client_loopback \
          --test e2e_publish_play_same_listener \
          --test e2e_publish_rejection \
          --test e2e_multiple_frames \
          --test e2e_audio_frames \
          -- --test-threads=1

    - name: Build & test without TLS
      run: |
        cargo build --no-default-features --verbose
        cargo test --no-default-features --verbose

    - name: Clippy
      run: cargo clippy --all-features --all-targets
