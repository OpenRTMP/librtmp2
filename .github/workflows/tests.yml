name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Build (default features)
      run: cargo build --all-features --verbose

    - name: Run tests (default features)
      run: cargo test --all-features --verbose

    - name: Run E2E integration tests (serial)
      run: |
        cargo test --all-features --verbose \
          --test server_client_loopback \
          --test e2e_publish_play_same_listener \
          --test e2e_publish_rejection \
          --test e2e_multiple_frames \
          --test e2e_audio_frames \
          -- --test-threads=1

    - name: Build & test without TLS
      run: |
        cargo build --no-default-features --verbose
        cargo test --no-default-features --verbose

    - name: Clippy
      run: cargo clippy --all-features --all-targets

  pr284-review-fixes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cursor/ci-autofix-automation-9931'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check out PR branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: cursor/ci-autofix-automation-9931
        fetch-depth: 0
        persist-credentials: true

    - name: Apply review fixes
      shell: bash
      run: |
        python - <<'PY'
        from pathlib import Path
        import re

        route_path = Path('src/session/publish_route.rs')
        route = route_path.read_text()
        marker = '''    pub(crate) fn release(&self, conn_id: u64, app: &str, stream: &str) {\n'''
        method = '''    /// Atomically move this connection's ownership from `previous` to `stream`.\n    /// The source route is left untouched when the destination is owned by\n    /// another connection or the source is no longer owned by `conn_id`.\n    pub(crate) fn replace_claim(\n        &self,\n        conn_id: u64,\n        app: &str,\n        previous: Option<&str>,\n        stream: &str,\n    ) -> bool {\n        let next_key = (app.to_string(), stream.to_string());\n        let previous_key = previous.map(|value| (app.to_string(), value.to_string()));\n        let Ok(mut map) = self.routes.lock() else {\n            return false;\n        };\n\n        if map.get(&next_key).is_some_and(|owner| *owner != conn_id) {\n            return false;\n        }\n\n        if let Some(previous_key) = previous_key.as_ref()\n            && previous_key != &next_key\n        {\n            if map.get(previous_key) != Some(&conn_id) {\n                return false;\n            }\n            map.remove(previous_key);\n        }\n\n        map.insert(next_key, conn_id);\n        true\n    }\n\n'''
        if 'pub(crate) fn replace_claim(' not in route:
            route = route.replace(marker, method + marker, 1)

        test_marker = '''    #[test]\n    fn force_release_clears_a_route_owned_by_another_connection() {\n'''
        route_test = '''    #[test]\n    fn replace_claim_keeps_source_when_destination_is_owned() {\n        let reg = registry();\n        assert!(reg.claim(1, "live", "old"));\n        assert!(reg.claim(2, "live", "new"));\n\n        assert!(!reg.replace_claim(1, "live", Some("old"), "new"));\n        assert!(\n            !reg.claim(3, "live", "old"),\n            "failed replacement must leave the source claim owned by conn 1"\n        );\n    }\n\n'''
        if 'replace_claim_keeps_source_when_destination_is_owned' not in route:
            route = route.replace(test_marker, route_test + test_marker, 1)
        route_path.write_text(route)

        conn_path = Path('src/session/conn.rs')
        text = conn_path.read_text()
        start = text.index('    fn evict_active_publish_route(&mut self) {\n')
        end = text.index('    fn clear_detected_stream_metadata(&mut self) {\n', start)
        replacement = '''    fn evict_active_publish_route(&mut self) -> Result<()> {\n        let was_publishing = self\n            .current_stream\n            .as_ref()\n            .map(|s| s.is_publishing)\n            .unwrap_or(false);\n        let claimed_route = self.claimed_publish_route.clone();\n        let live_route_key = was_publishing.then(|| self.relay_route_key());\n\n        // Reserve enough bounded eviction capacity before releasing ownership.\n        // If the queue is full, keeping the route claimed is safer than letting\n        // a new publisher inherit stale codec/init headers.\n        let mut unique = std::collections::HashSet::new();\n        let mut routes_to_evict = Vec::new();\n        for route_key in [claimed_route.clone(), live_route_key]\n            .into_iter()\n            .flatten()\n        {\n            if route_key.is_empty() || !unique.insert(route_key.clone()) {\n                continue;\n            }\n            if !self.pending_cache_eviction_exists(&self.app, &route_key) {\n                routes_to_evict.push(route_key);\n            }\n        }\n        if self\n            .pending_cache_evictions\n            .len()\n            .saturating_add(routes_to_evict.len())\n            > MAX_PENDING_CACHE_EVICTIONS\n        {\n            return Err(ErrorCode::Protocol);\n        }\n\n        self.release_claimed_publish_route();\n        for route_key in routes_to_evict {\n            self.push_pending_cache_eviction(self.app.clone(), route_key)?;\n        }\n\n        if was_publishing {\n            self.clear_detected_stream_metadata();\n        }\n        self.injected_media_bytes = 0;\n        Ok(())\n    }\n\n    fn release_claimed_publish_route(&mut self) {\n        if let Some(claimed) = self.claimed_publish_route.take() {\n            if let Some(routes) = self.publish_routes.as_ref() {\n                routes.release(self.conn_id, &self.app, &claimed);\n            }\n        }\n    }\n\n    fn pending_cache_eviction_exists(&self, app: &str, route_key: &str) -> bool {\n        self.pending_cache_evictions\n            .iter()\n            .any(|(queued_app, queued_key)| queued_app == app && queued_key == route_key)\n    }\n\n    fn can_push_pending_cache_eviction(&self, app: &str, route_key: &str) -> bool {\n        self.pending_cache_eviction_exists(app, route_key)\n            || self.pending_cache_evictions.len() < MAX_PENDING_CACHE_EVICTIONS\n    }\n\n    fn push_pending_cache_eviction(&mut self, app: String, route_key: String) -> Result<()> {\n        if self.pending_cache_eviction_exists(&app, &route_key) {\n            return Ok(());\n        }\n        if self.pending_cache_evictions.len() >= MAX_PENDING_CACHE_EVICTIONS {\n            return Err(ErrorCode::Protocol);\n        }\n        self.pending_cache_evictions.push((app, route_key));\n        Ok(())\n    }\n\n    fn claim_publish_route(&mut self, stream: &str) -> bool {\n        let previous = self.claimed_publish_route.clone();\n        let renaming = previous\n            .as_deref()\n            .is_some_and(|prev| !prev.is_empty() && prev != stream);\n\n        let Some(routes) = self.publish_routes.as_ref() else {\n            self.claimed_publish_route = Some(stream.to_string());\n            return true;\n        };\n\n        if renaming\n            && previous.as_deref().is_some_and(|prev| {\n                !self.can_push_pending_cache_eviction(&self.app, prev)\n            })\n        {\n            return false;\n        }\n\n        if !routes.replace_claim(self.conn_id, &self.app, previous.as_deref(), stream) {\n            return false;\n        }\n\n        if let Some(prev) = previous.filter(|prev| !prev.is_empty() && prev != stream)\n            && self\n                .push_pending_cache_eviction(self.app.clone(), prev.clone())\n                .is_err()\n        {\n            // Capacity was preflighted above, so this is defensive. Restore the\n            // registry atomically and only advertise the old claim if restore\n            // actually succeeds.\n            let restored = self.publish_routes.as_ref().is_some_and(|routes| {\n                routes.replace_claim(self.conn_id, &self.app, Some(stream), &prev)\n            });\n            self.claimed_publish_route = restored.then_some(prev);\n            return false;\n        }\n\n        self.claimed_publish_route = Some(stream.to_string());\n        true\n    }\n\n'''
        text = text[:start] + replacement + text[end:]

        text = text.replace(\n            '                if renaming_route {\\n                    if self\\n                        .push_pending_cache_eviction(',\n            '                if renaming_route && self.publish_routes.is_none() {\\n                    if self\\n                        .push_pending_cache_eviction(',\n            1,\n        )

        text = text.replace('self.evict_active_publish_route();', 'self.evict_active_publish_route()?;')
        text = re.sub(\n            r'(?m)^(\\s*)([A-Za-z_][A-Za-z0-9_]*)\\.evict_active_publish_route\\(\\);$',\n            lambda m: f'{m.group(1)}{m.group(2)}.evict_active_publish_route().unwrap();'\n            if m.group(2) != 'self' else m.group(0),\n            text,\n        )

        test_marker = '''    #[test]\n    fn evict_active_publish_route_clears_detected_codecs() {\n'''
        cap_test = '''    #[test]\n    fn eviction_cap_preserves_active_route_claim() {\n        use std::collections::HashMap;\n        use std::sync::{Arc, Mutex};\n\n        let routes = Arc::new(Mutex::new(HashMap::new()));\n        let registry = PublishRouteRegistry::new(Arc::clone(&routes));\n        assert!(registry.claim(7, "live", "cam"));\n\n        let mut conn = Conn::new();\n        conn.conn_id = 7;\n        conn.app = "live".to_string();\n        conn.current_stream = Some(Box::new(Stream::new(1)));\n        conn.current_stream.as_mut().unwrap().is_publishing = true;\n        conn.publish_routes = Some(registry);\n        conn.claimed_publish_route = Some("cam".to_string());\n        conn.pending_cache_evictions = (0..MAX_PENDING_CACHE_EVICTIONS)\n            .map(|i| ("live".to_string(), format!("stale-{i}")))\n            .collect();\n\n        assert_eq!(conn.evict_active_publish_route(), Err(ErrorCode::Protocol));\n        assert_eq!(\n            routes.lock().unwrap().get(&("live".to_string(), "cam".to_string())),\n            Some(&7),\n            "route ownership must remain intact when eviction capacity is exhausted"\n        );\n        assert_eq!(conn.claimed_publish_route.as_deref(), Some("cam"));\n    }\n\n'''
        if 'fn eviction_cap_preserves_active_route_claim()' not in text:
            text = text.replace(test_marker, cap_test + test_marker, 1)

        conn_path.write_text(text)
        PY

    - name: Format and validate
      run: |
        cargo fmt --all
        cargo check --all-features
        cargo test --all-features --lib
        cargo clippy --all-features --all-targets -- -D warnings

    - name: Commit validated review fixes
      run: |
        git fetch origin main
        git checkout origin/main -- .github/workflows/tests.yml
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "fix: make publish route eviction and rollback atomic"
        git push origin HEAD:cursor/ci-autofix-automation-9931
