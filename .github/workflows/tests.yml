name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Verify Cargo.lock is up to date
      run: cargo metadata --locked --all-features --format-version 1 > /dev/null

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Build (default features)
      run: cargo build --locked --all-features --verbose

    - name: Run tests (default features)
      run: cargo test --locked --all-features --verbose

    - name: Run E2E integration tests (serial)
      run: |
        cargo test --locked --all-features --verbose \
          --test server_client_loopback \
          --test cross_platform_transport \
          --test e2e_publish_play_same_listener \
          --test e2e_publish_rejection \
          --test e2e_multiple_frames \
          --test e2e_audio_frames \
          -- --test-threads=1

    - name: Build & test without TLS
      run: |
        cargo build --locked --no-default-features --verbose
        cargo test --locked --no-default-features --verbose

    - name: Clippy
      run: cargo clippy --locked --all-features --all-targets -- -D warnings

    - name: Docs (broken intra-doc links fail the build)
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --locked --no-deps --all-features
