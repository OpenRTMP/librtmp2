name: Apply PR 132 review fix

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/application-security-review-6876
          fetch-depth: 0

      - name: Apply review fix
        run: python3 .github/scripts/pr132_review_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Capture test result
        run: |
          set +e
          cargo test --no-default-features multitrack > .github/pr132-test.log 2>&1
          first_status=$?
          cargo test --no-default-features drain_ready_messages_rejects_oversized_multitrack_video >> .github/pr132-test.log 2>&1
          second_status=$?
          printf '%s %s\n' "$first_status" "$second_status" > .github/pr132-test.status
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session/conn.rs src/client/mod.rs .github/pr132-test.log .github/pr132-test.status
          git commit -m "Apply multitrack rejection fix for validation"
          git push origin HEAD:cursor/application-security-review-6876
