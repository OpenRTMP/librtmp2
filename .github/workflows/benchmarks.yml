name: Benchmarks

# What runs when (see docs/ci-benchmarks.md):
#
#   merge to main      bench -> rewrite the "CI benchmarks" block in
#                      BENCHMARKS.md -> store as the latest run on `bench-data`
#                      (the website reads it as "next release preview")
#   release            called from release.yml once the GitHub Release exists
#                      (a separate job there, so PPA / crates.io never wait for
#                      it): bench -> attach results to the release (asset +
#                      release notes) -> store under releases/<tag>.json
#   workflow_dispatch  bench -> comparison in the job log only, nothing published
#   pull_request       same, log only
#
# Every run is compared against the last release and the last `main` run, with
# a note on how comparable the machines were.

on:
  push:
    branches: [main]
    paths-ignore:
      - BENCHMARKS.md
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to benchmark (e.g. v0.11.0)
        type: string
        required: true

permissions:
  contents: read

jobs:
  bench:
    name: cargo bench
    runs-on: ubuntu-latest
    # A benchmark problem must never turn a finished release red.
    continue-on-error: ${{ inputs.tag && true || false }}
    concurrency:
      group: bench-${{ inputs.tag || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    env:
      KIND: ${{ inputs.tag && 'release' || (github.event_name == 'push' && 'main' || (github.event_name == 'pull_request' && 'pr' || 'manual')) }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run protocol benchmarks
        run: |
          set -o pipefail
          # A restored target/ cache may hold Criterion output of earlier runs
          # (or of the other suite), which would be mislabelled below.
          rm -rf target/criterion
          cargo bench --bench protocol --features default -- --sample-size 20 --noplot 2>&1 | tee bench-protocol.txt
          rm -rf crit-protocol && mv target/criterion crit-protocol

      - name: Run relay benchmarks
        run: |
          set -o pipefail
          # A restored target/ cache may hold Criterion output of earlier runs
          # (or of the other suite), which would be mislabelled below.
          rm -rf target/criterion
          cargo bench --bench relay --features default -- --sample-size 10 --noplot 2>&1 | tee bench-relay.txt
          rm -rf crit-relay && mv target/criterion crit-relay

      - name: Collect results
        run: |
          python3 scripts/bench_report.py collect \
            --suite protocol=crit-protocol --suite relay=crit-relay \
            --kind "$KIND" --tag "$TAG" --out results.json

      - name: Fetch baselines (last release, last main run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout above has no credentials; the baselines live on the
          # public `bench-data` branch.
          git remote -v | grep -q origin || git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          python3 scripts/bench_report.py baselines --out-dir baselines --exclude-tag "$TAG"

      - name: Compare
        run: |
          args=(--current results.json --mode "$KIND" --out comparison.md)
          [ -f baselines/release.json ] && args+=(--release baselines/release.json)
          [ -f baselines/previous.json ] && args+=(--previous baselines/previous.json)
          python3 scripts/bench_report.py compare "${args[@]}" \
            --heading "### Benchmarks ($KIND run)"
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat comparison.md

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librtmp2-benchmarks
          path: |
            bench-*.txt
            results.json
            comparison.md

  publish-main:
    name: update BENCHMARKS.md and latest run
    needs: bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bench-publish-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librtmp2-benchmarks

      - name: Rewrite the CI block in BENCHMARKS.md
        run: |
          # Heading and explanation are static text above the markers.
          sed '1,2d' comparison.md > ci-block.md
          python3 scripts/bench_report.py splice --target ci --file BENCHMARKS.md --fragment ci-block.md

      - name: Commit BENCHMARKS.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md
          if git diff --cached --quiet; then echo "BENCHMARKS.md unchanged"; exit 0; fi
          git commit -m "docs(bench): update CI benchmarks for ${GITHUB_SHA::7} [skip ci]"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for i in 1 2 3; do
            git -c http.extraheader="$auth" pull --rebase origin main || true
            if git -c http.extraheader="$auth" push origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::warning::could not push BENCHMARKS.md to main (branch protection?). The results are still in the job summary."

      - name: Store as latest run on bench-data
        run: scripts/publish-bench-data.sh latest.json results.json

  publish-release:
    name: attach to release
    needs: bench
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librtmp2-benchmarks

      - name: Add results to the GitHub Release
        run: |
          cp results.json "bench-results-$TAG.json"
          cp comparison.md "BENCHMARKS-$TAG.md"
          gh release upload "$TAG" "bench-results-$TAG.json" "BENCHMARKS-$TAG.md" --clobber
          {
            echo "## Benchmarks"
            echo
            echo "_Measured automatically for this release on a CI runner; the machine is described below. Raw data: \`bench-results-$TAG.json\`._"
            echo
            sed '1,2d' comparison.md
          } > release-block.md
          gh release view "$TAG" --json body --jq .body > body.md
          python3 scripts/bench_report.py splice --target release --file body.md --fragment release-block.md
          gh release edit "$TAG" --notes-file body.md

      - name: Store under releases/ on bench-data
        run: scripts/publish-bench-data.sh "releases/$TAG.json" results.json
