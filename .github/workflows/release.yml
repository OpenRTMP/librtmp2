name: Release

# Builds and packages tagged releases. Push a tag like `v0.1.0` (or run
# manually) to produce source + prebuilt library tarballs and a GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build abigail-tools libabigail-dev abi-compliance-checker

      - name: Build (release)
        run: make release

      - name: Run unit tests
        run: make test

      - name: Run unit tests (ASan)
        run: make clean && make DEBUG=1 ASAN=1 test

      - name: ABI compliance check
        run: ./scripts/abi-baseline.sh compare HEAD

  package:
    name: build & package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build

      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Check version matches version.h
        run: |
          HDR_VERSION=$(grep -oP 'LRTMP2_VERSION_STRING\s+"\K[0-9]+\.[0-9]+\.[0-9]+' include/librtmp2/version.h)
          echo "tag version: ${{ steps.ver.outputs.version }}, header version: $HDR_VERSION"
          if [ "${{ steps.ver.outputs.version }}" != "$HDR_VERSION" ]; then
            echo "::error::Tag version (${{ steps.ver.outputs.version }}) does not match LRTMP2_VERSION_STRING ($HDR_VERSION) in include/librtmp2/version.h"
            exit 1
          fi

      - name: Build release libraries
        run: make release

      - name: Stage install tree
        run: |
          make install PREFIX="$PWD/dist/librtmp2-${{ steps.ver.outputs.version }}"

      - name: Create binary tarball
        run: |
          cd dist
          tar czf "librtmp2-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" \
            "librtmp2-${{ steps.ver.outputs.version }}"
          sha256sum "librtmp2-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" \
            > "librtmp2-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz.sha256"

      - name: Create source tarball
        run: |
          git archive --format=tar.gz \
            --prefix="librtmp2-${{ steps.ver.outputs.version }}/" \
            -o "dist/librtmp2-${{ steps.ver.outputs.version }}-src.tar.gz" HEAD
          cd dist
          sha256sum "librtmp2-${{ steps.ver.outputs.version }}-src.tar.gz" \
            > "librtmp2-${{ steps.ver.outputs.version }}-src.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: librtmp2-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: librtmp2 ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
