name: Apply PR 128 relay budget fixes

on:
  push:
    branches:
      - feat/ertmp-v2-multitrack-0.4.0
    paths:
      - .github/workflows/pr128-relay-budget-fixes.yml
      - .github/scripts/pr128_relay_budget_fixes.py

permissions:
  contents: write

concurrency:
  group: pr128-relay-budget-fixes
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/ertmp-v2-multitrack-0.4.0
          fetch-depth: 0

      - name: Apply, format, and validate
        id: validate
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            python3 .github/scripts/pr128_relay_budget_fixes.py
            rustup default stable
            cargo fmt --all
            cargo fmt --all -- --check
            cargo test --all-targets
            cargo clippy --all-targets -- -D warnings
          } > /tmp/pr128-relay-budget.log 2>&1
          status=$?
          cat /tmp/pr128-relay-budget.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit fixes and remove temporary automation
        if: steps.validate.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr128-relay-budget-fixes.yml
          git rm .github/scripts/pr128_relay_budget_fixes.py
          git rm --ignore-unmatch .github/pr128-relay-budget-error.txt
          git add src/server/mod.rs CHANGELOG.md
          git commit -m "fix(server): make relay budget configurable and starvation-free"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0

      - name: Record validation failure
        if: steps.validate.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree --staged src/server/mod.rs CHANGELOG.md || true
          cp /tmp/pr128-relay-budget.log .github/pr128-relay-budget-error.txt
          printf '\nworkflow_run=%s\n' "$GITHUB_RUN_ID" >> .github/pr128-relay-budget-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr128-relay-budget-error.txt
          git commit -m "ci: record PR 128 relay budget validation failure"
          git push origin HEAD:feat/ertmp-v2-multitrack-0.4.0
          exit 1
