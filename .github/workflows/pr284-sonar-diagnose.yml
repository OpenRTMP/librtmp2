name: PR 284 Sonar diagnose

on:
  push:
    branches:
      - cursor/ci-autofix-automation-9931

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query SonarQube Cloud issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url='https://sonarcloud.io/api/issues/search?componentKeys=OpenRTMP_librtmp2&pullRequest=284&issueStatuses=OPEN%2CCONFIRMED&sinceLeakPeriod=true&ps=100'
          if [[ -n "${SONAR_TOKEN:-}" ]]; then
            curl -fsSL -u "${SONAR_TOKEN}:" "$url" -o /tmp/issues.json
          else
            curl -fsSL "$url" -o /tmp/issues.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/issues.json').read_text())
          issues = data.get('issues', [])
          print(f"Sonar issues: {len(issues)}")
          for issue in issues:
              print('---')
              for key in ('key', 'rule', 'severity', 'type', 'component', 'line', 'message', 'status', 'cleanCodeAttribute'):
                  print(f"{key}: {issue.get(key)}")
              print('textRange:', issue.get('textRange'))
          PY
