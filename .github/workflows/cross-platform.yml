name: Cross-Platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: cargo test (macOS, all features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Generate lockfile for reproducible builds
        run: cargo generate-lockfile

      - name: Point openssl-sys at Homebrew OpenSSL
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Build (all features)
        run: cargo build --locked --all-features --verbose

      - name: Test (all features)
        run: cargo test --all-features --verbose

      - name: Run E2E integration tests (serial)
        run: |
          cargo test --all-features --verbose \
            --test server_client_loopback \
            --test e2e_publish_play_same_listener \
            --test e2e_publish_rejection \
            --test e2e_multiple_frames \
            --test e2e_audio_frames \
            -- --test-threads=1

      - name: Build & test without TLS
        run: |
          cargo build --locked --no-default-features --verbose
          cargo test --no-default-features --verbose

# No Windows job: `server`, `client`, `transport`, and `session::conn` build
# their socket ownership handoff on `std::os::unix::io::{AsRawFd, IntoRawFd,
# FromRawFd}` throughout, not just behind the `tls` feature. Building even
# `--no-default-features` on Windows fails with ~30 E0599 errors ("no method
# named `as_raw_fd`/`into_raw_fd` found"). Making the socket layer portable to
# `AsRawSocket`/`RawSocket` is a real feature, not a CI addition — tracked
# separately rather than folded into this PR.
