name: Publish to Ubuntu PPA

# Builds a signed Debian source package and uploads it to a Launchpad PPA
# for each targeted Ubuntu series. Launchpad's own build farm then compiles
# the binary .deb packages — this workflow never produces or uploads a
# binary package itself.
#
# Runs as part of release.yml's "publish-ppa" job on every tag push or
# manual release run, so it has no push/tag trigger of its own (that would
# double-publish alongside release.yml). workflow_dispatch below is only
# for standalone/retry runs of just the PPA publish step.
#
# Requires (see docs/publishing-ppa.md for full setup):
#   secrets.PPA_GPG_PRIVATE_KEY   - ASCII-armored private key, registered
#                                    and confirmed on the Launchpad account
#   secrets.PPA_GPG_KEY_ID        - the key's long key ID or fingerprint
#   secrets.PPA_GPG_PASSPHRASE    - passphrase protecting that key
#   vars.PPA_TARGET               - "launchpad-user/ppa-name", e.g.
#                                    "openrtmp/librtmp2"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true
      series:
        description: 'Comma-separated Ubuntu series to target'
        required: false
        default: 'resolute,stonking'
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: false
        type: string
      series:
        description: 'Comma-separated Ubuntu series to target'
        required: false
        type: string
        default: 'resolute,stonking'
    secrets:
      PPA_GPG_PRIVATE_KEY:
        required: true
      PPA_GPG_KEY_ID:
        required: true
      PPA_GPG_PASSPHRASE:
        required: true

permissions:
  contents: read

jobs:
  resolve:
    name: resolve inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      series: ${{ steps.ver.outputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve version and series matrix
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_SERIES: ${{ inputs.series }}
        run: |
          REF="${INPUT_TAG:-$REF_NAME}"
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

          SERIES_CSV="${INPUT_SERIES:-resolute,stonking}"
          SERIES_JSON=$(printf '%s' "$SERIES_CSV" | tr ',' '\n' | jq -R . | jq -sc .)
          echo "series=$SERIES_JSON" >> "$GITHUB_OUTPUT"

  publish:
    name: build & upload (${{ matrix.series }})
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJson(needs.resolve.outputs.series) }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      SERIES: ${{ matrix.series }}
      # Revision 1 resets on each upstream release; a per-run suffix makes
      # same-version uploads unique (run_number alone is not enough for reruns).
      BUILD_ID: ${{ github.run_number }}r${{ github.run_attempt }}
      DEBEMAIL: info@openrtmp.org
      DEBFULLNAME: OpenRTMP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Prepare Debian packaging for revisioned source uploads
        # Standalone runs may publish older release tags (such as v0.17.1)
        # whose checkout still contains 3.0 (native) and the old vendor path.
        # Normalize the packaging without modifying the upstream sources.
        run: |
          printf '3.0 (quilt)\n' > debian/source/format
          sed -i 's#^VENDOR_ARCHIVE := vendor.tar.xz$#VENDOR_ARCHIVE := debian/vendor.tar.xz#' debian/rules
          grep -qx 'VENDOR_ARCHIVE := debian/vendor.tar.xz' debian/rules

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts debhelper dput lintian \
            build-essential libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Resolve cbindgen version
        id: cbindgen_ver
        run: |
          VERSION=$(grep -oP 'CBINDGEN_VERSION="\K[0-9.]+' scripts/generate-header.sh)
          test -n "$VERSION" || { echo "::error::Could not resolve CBINDGEN_VERSION from scripts/generate-header.sh"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install cbindgen
        run: cargo install --locked --version "${{ steps.cbindgen_ver.outputs.version }}" cbindgen

      - name: Generate C header
        # The PPA builder has no network access and cannot install cbindgen
        # itself, so the header is generated here (from the exact tagged
        # source) and shipped as a plain file in the Debian source package;
        # debian/rules just installs it.
        run: bash scripts/generate-header.sh

      - name: Vendor cargo dependencies for an offline build
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml

      - name: Verify the raw vendored tree builds offline
        run: cargo build --locked --release --offline --all-features --verbose

      - name: Archive the vendored tree for the Debian source package
        # Keep generated dependencies in debian/ so every retry can use the
        # same deterministic upstream source tarball (3.0 quilt). The PPA
        # builder extracts the vendored crates from this archive offline.
        run: |
          tar --sort=name \
              --mtime='@0' \
              --owner=0 --group=0 --numeric-owner \
              -cJf debian/vendor.tar.xz -C vendor .
          rm -rf vendor target debian/cargo_home

      - name: Create deterministic upstream source archive
        # Debian revisions require 3.0 (quilt). Keep generated (potentially
        # non-reproducible) vendor content in debian/vendor.tar.xz instead.
        run: |
          tar --sort=name \
              --mtime='@0' \
              --owner=0 --group=0 --numeric-owner \
              --exclude='./.git' --exclude='./debian' \
              --transform="s#^[.]#librtmp2-${VERSION}#" \
              -cJf "../librtmp2_${VERSION}.orig.tar.xz" .

      - name: Add changelog entry for ${{ matrix.series }}
        run: |
          DEB_VERSION="${VERSION}-1~${SERIES}${BUILD_ID}"
          echo "DEB_VERSION=${DEB_VERSION}" >> "$GITHUB_ENV"
          dch --package librtmp2 \
              --newversion "${DEB_VERSION}" \
              --distribution "${SERIES}" \
              --force-distribution \
              --force-bad-version \
              "Automated build of ${VERSION} for ${SERIES}."

      - name: Build source package (unsigned)
        # -d: skip the Build-Depends check. cargo/rustc are installed via
        # dtolnay/rust-toolchain (rustup), not apt, so dpkg doesn't see them
        # as satisfying debian/control's Build-Depends.
        run: dpkg-buildpackage -S -sa -us -uc -d

      - name: Verify the generated source package builds offline
        # Test the exact archive that will be uploaded, not the working tree.
        # This catches files lost during debian/rules clean or dpkg-source.
        run: |
          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          DSC="../librtmp2_${DEB_VERSION}.dsc"
          dpkg-source -x "$DSC" "$VERIFY_DIR/source"
          make -C "$VERIFY_DIR/source" -f debian/rules override_dh_auto_build

      - name: Lintian (non-blocking sanity check)
        run: lintian --pedantic "../librtmp2_${DEB_VERSION}_source.changes" || true

      - name: Import signing key
        # Secrets go through the environment, never into the script text:
        # an expression expanded inline becomes part of the shell source.
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' >> ~/.gnupg/gpg-agent.conf
          printf 'pinentry-mode loopback\n' >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          printf '%s' "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign source package
        env:
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          PPA_GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
        run: |
          PASSFILE=$(mktemp)
          chmod 600 "$PASSFILE"
          trap 'shred -u "$PASSFILE" 2>/dev/null' EXIT
          printf '%s' "$PPA_GPG_PASSPHRASE" > "$PASSFILE"
          debsign -k"$PPA_GPG_KEY_ID" \
            -p"gpg --batch --pinentry-mode loopback --passphrase-file $PASSFILE" \
            "../librtmp2_${DEB_VERSION}_source.changes"

      - name: Upload to PPA
        env:
          PPA_TARGET: ${{ vars.PPA_TARGET }}
        run: |
          test -n "$PPA_TARGET" || { echo "::error::vars.PPA_TARGET is not set"; exit 1; }
          dput "ppa:${PPA_TARGET}" \
            "../librtmp2_${DEB_VERSION}_source.changes"
