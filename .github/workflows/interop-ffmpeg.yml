name: Interop (ffmpeg publish)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop-ffmpeg:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install ffmpeg
      uses: ./.github/actions/apt-install
      with:
        packages: ffmpeg

    - name: Interop — publish from real ffmpeg
      run: ./tests/interop/ffmpeg_interop.sh

    - name: Interop — Enhanced-RTMP (HEVC + AV1 FourCC) ingest
      run: ./tests/interop/enhanced_rtmp_interop.sh
