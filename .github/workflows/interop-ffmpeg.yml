name: Interop (ffmpeg publish)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  interop-ffmpeg:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install ffmpeg
      run: |
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
        sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Interop — publish from real ffmpeg
      run: ./tests/interop/ffmpeg_interop.sh

    - name: Interop — Enhanced-RTMP (HEVC + AV1 FourCC) ingest
      run: ./tests/interop/enhanced_rtmp_interop.sh
