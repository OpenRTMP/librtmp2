name: Interop (ffmpeg publish)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop-ffmpeg:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Interop — publish from real ffmpeg
      run: ./tests/interop/ffmpeg_interop.sh

    - name: Interop — Enhanced-RTMP (HEVC + AV1 FourCC) ingest
      run: ./tests/interop/enhanced_rtmp_interop.sh
