name: Interop (ffmpeg publish)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  interop-ffmpeg:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Interop — publish from real ffmpeg (ASan/UBSan)
      run: ./tests/interop/ffmpeg_interop.sh
      env:
        SAN: "1"

    - name: Interop — Enhanced-RTMP (HEVC + AV1 FourCC) ingest (ASan/UBSan)
      run: ./tests/interop/enhanced_rtmp_interop.sh
      env:
        SAN: "1"
