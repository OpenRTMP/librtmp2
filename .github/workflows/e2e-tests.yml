name: E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: librtmp2 end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run E2E integration tests
        run: |
          cargo test --all-features --verbose \
            --test server_client_loopback \
            --test e2e_publish_play_same_listener \
            --test e2e_publish_rejection \
            --test e2e_multiple_frames \
            --test e2e_audio_frames \
            -- --test-threads=1
