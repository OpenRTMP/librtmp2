name: Supply Chain

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }}, ${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
        # cargo-deny resolves the dependency graph rooted at whichever
        # manifest it's pointed at, not the whole workspace: this repo's
        # root Cargo.toml is a package (not a virtual workspace manifest),
        # so a root-only run never sees the `fuzz` member's own graph (e.g.
        # libfuzzer-sys's NCSA-licensed component). Check both manifests.
        manifest:
          - Cargo.toml
          - fuzz/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@deb6b2ccc5004cae3fb73fe4dcd60492786cb1dd # cargo-deny

      - name: Run cargo-deny
        run: cargo deny --log-level warn --manifest-path "${{ matrix.manifest }}" --all-features check ${{ matrix.checks }}
