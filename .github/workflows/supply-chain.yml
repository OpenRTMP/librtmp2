name: Supply Chain

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }}, ${{ matrix.manifest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
        # cargo-deny resolves the dependency graph rooted at whichever
        # manifest it's pointed at, not the whole workspace: this repo's
        # root Cargo.toml is a package (not a virtual workspace manifest),
        # so a root-only run never sees the `fuzz` member's own graph (e.g.
        # libfuzzer-sys's NCSA-licensed component). Check both manifests.
        manifest:
          - Cargo.toml
          - fuzz/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check ${{ matrix.checks }}
