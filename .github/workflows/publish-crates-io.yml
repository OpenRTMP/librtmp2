name: Publish to crates.io

# Publishes the crate to crates.io. Runs as a job of release.yml
# ("publish-crates-io"), so every tag push or manual release.yml run
# publishes to crates.io automatically alongside the GitHub Release and
# PPA publish - there's nothing extra to trigger. workflow_dispatch below
# is only for a standalone/retry run of just this step.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: false
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          REF="${INPUT_TAG:-$REF_NAME}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | grep -oP '"\K[0-9]+\.[0-9]+\.[0-9]+')
          echo "tag version: ${{ steps.ver.outputs.version }}, Cargo.toml version: $CARGO_VERSION"
          if [ "${{ steps.ver.outputs.version }}" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version (${{ steps.ver.outputs.version }}) does not match version in Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if curl -fsSL \
            -H "User-Agent: librtmp2-ci (https://github.com/OpenRTMP/librtmp2)" \
            "https://crates.io/api/v1/crates/librtmp2/${VERSION}" >/dev/null 2>&1; then
            echo "librtmp2@${VERSION} is already on crates.io — skipping publish"
          else
            cargo publish --all-features
          fi
