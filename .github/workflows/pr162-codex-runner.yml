name: Run PR 162 Codex fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.pull_request.number == 162 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.codex-apply.py')
          lines = path.read_text().splitlines()
          fixed = []
          in_literal = False
          for line in lines:
              if in_literal:
                  if line == '"""':
                      in_literal = False
                      fixed.append(line)
                  else:
                      indent = len(line) - len(line.lstrip(' '))
                      if line and indent % 4 == 2:
                          line = ' ' * 10 + line
                      fixed.append(line)
              else:
                  fixed.append(line)
                  if line.count('"""') % 2 == 1:
                      in_literal = True
          path.write_text('\n'.join(fixed) + '\n')
          PY
          python3 .codex-apply.py >/tmp/apply.log 2>&1

      - name: Capture patch failure
        if: failure()
        shell: bash
        run: |
          cp /tmp/apply.log .codex-diagnostic.txt
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add .codex-diagnostic.txt
          git commit -m "chore: capture Codex patch failure" || true
          git push origin HEAD:${{ github.head_ref }}

      - name: Format and test
        run: |
          cargo fmt --all
          cargo test
          cargo test --no-default-features

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "openai-codex[bot]"
          git config user.email "openai-codex[bot]@users.noreply.github.com"
          git add src/client/mod.rs src/session/conn.rs src/server/mod.rs
          git rm .github/workflows/pr162-codex-fixes.yml
          git rm .github/workflows/pr162-codex-runner.yml
          git rm .codex-pr162-kick
          git rm .codex-apply.py
          git rm .codex-diagnostic.txt
          git commit -m "fix: address Codex review findings"
          git push origin HEAD:${{ github.head_ref }}
