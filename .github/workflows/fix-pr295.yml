name: Fix PR 295

on:
  push:
    branches:
      - security/fix-play-teardown-and-multitrack-auth-budget
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/fix-play-teardown-and-multitrack-auth-budget
          fetch-depth: 0
          persist-credentials: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/session/conn.rs")
          lines = path.read_text().splitlines()

          # Only on_media_cb authorization work should consume the auth budget.
          fn_idx = next(i for i, line in enumerate(lines) if line.strip() == "fn authorize_media_frame(")
          if_idx = next(i for i in range(fn_idx, len(lines)) if lines[i].strip() == "if !is_multitrack {")
          guard_lines = [
              "        // Without an authorization callback there is no per-track auth work",
              "        // to budget here. The frame-callback path applies its own sub-track",
              "        // budget independently below.",
              "        if self.on_media_cb.is_none() {",
              "            return Ok(());",
              "        }",
              "",
          ]
          lines[if_idx:if_idx] = guard_lines

          # Budget exhaustion is intentionally a protocol error; assert it.
          test_idx = next(
              i for i, line in enumerate(lines)
              if line.strip() == "fn multitrack_on_media_cb_authorization_consume_message_budget() {"
          )
          budget_idx = next(
              i for i in range(test_idx, len(lines))
              if lines[i].strip() == "let mut messages_budget = 2;"
          )
          call_start = budget_idx + 1
          if not lines[call_start].strip().startswith("conn.handle_media_frame("):
              raise SystemExit("unexpected on_media_cb test call layout")
          unwrap_idx = next(
              i for i in range(call_start, min(call_start + 6, len(lines)))
              if lines[i].strip() == ".unwrap();"
          )
          lines[call_start:unwrap_idx + 1] = [
              "        assert_eq!(",
              "            conn.handle_media_frame(1, FrameType::Video, 0, &payload, Some(&mut messages_budget)),",
              "            Err(ErrorCode::Protocol)",
              "        );",
          ]

          # The setup timeout is 10s, so the test must start beyond that boundary.
          test_idx = next(
              i for i, line in enumerate(lines)
              if line.strip() == "fn play_teardown_cycling_cannot_reset_setup_timer_without_relay() {"
          )
          timeout_idx = next(
              i for i in range(test_idx, len(lines))
              if "Duration::from_secs(9)" in lines[i]
          )
          lines[timeout_idx] = lines[timeout_idx].replace(
              "Duration::from_secs(9)", "Duration::from_secs(11)"
          )

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Format
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run library tests
        run: cargo test --all-features --lib --verbose

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session/conn.rs
          git commit -m "fix(conn): correct PR 295 budget and teardown regressions"
          git push origin HEAD:security/fix-play-teardown-and-multitrack-auth-budget
