name: Fuzz

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds per target (extended run)
        default: "45"
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

env:
  # Quick on push/PR; the weekly schedule runs a longer campaign.
  FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || github.event.inputs.fuzz_seconds || '45' }}

jobs:
  libfuzzer:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - chunk_read
          - handshake_server
          - amf0_skip
          - ertmp_parse
          - control_decode
          - video_config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_LIMIT: ${{ env.FUZZ_SECONDS }}
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          args=("fuzz/corpus/$TARGET")
          [ -d "tests/seeds/$TARGET" ] && args+=("tests/seeds/$TARGET")
          cargo fuzz run "$TARGET" "${args[@]}" -- \
            -max_total_time="$SECONDS_LIMIT" \
            -reload=0 \
            -print_final_stats=1

  # Extended verification: not run on push/PR (the short churn test already
  # runs in `cargo test`).
  churn-stress:
    name: Malformed-publisher churn (extended)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run churn stress test
        env:
          CHURN_ROUNDS: "5000"
        run: cargo test --locked --release --test malformed_churn -- --ignored --nocapture
