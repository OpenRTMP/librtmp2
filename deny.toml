[graph]
# Only the platforms CI actually builds/runs on. Left unrestricted, cargo-deny
# considers every cfg-gated dependency for every target rustc knows about
# (e.g. libfuzzer-sys pulls in the UEFI-only `r-efi` under some targets),
# which flags licenses/advisories for code that's never actually compiled.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The fuzz crate depends on the parent crate via an unversioned path dep
# (`librtmp2 = { path = ".." }`), which is exactly what a workspace path
# dependency should look like, not a registry crate pinned to "*".
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
